
[project]
name = "ai-knowledge-assistant"
version = "0.1.0"
description = ""
authors = [
    {name = "Kubra Siraj",email = "kubrasiraj267@gmail.com"}
]
requires-python = ">=3.11,<4.0"

dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "sqlalchemy (>=2.0.54,<3.0.0)",
    "psycopg[binary] (>=3.3.5,<4.0.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
    "pymupdf (>=1.28.2,<2.0.0)",
    "langchain-text-splitters (>=1.1.2,<2.0.0)",
    "pwdlib[argon2] (>=0.3.1,<0.4.0)",
    "pydantic[email] (>=2.13.5,<3.0.0)",
    "pyjwt (>=2.14.0,<3.0.0)",
    "sentence-transformers (>=6.0.1,<7.0.0)",
    "groq (>=1.7.0,<2.0.0)",
    "python-docx (>=1.2.0,<2.0.0)",
    "pytest (>=9.1.1,<10.0.0)"
]

[tool.poetry]
packages = [
    { include = "app" }
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

